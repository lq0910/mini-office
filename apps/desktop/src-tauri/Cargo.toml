[package]
name = "mini-office-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mini Office — 轻量、离线优先的跨平台办公套件"

[lib]
name = "mini_office_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
office-core.workspace = true
office-ooxml.workspace = true
office-security.workspace = true
office-storage.workspace = true
office-font.workspace = true
office-pdf.workspace = true
office-platform.workspace = true
office-compat.workspace = true
office-doc.workspace = true
office-sheet.workspace = true
office-slides.workspace = true
uuid.workspace = true
chrono.workspace = true

# 功能：macOS 原生位图及富文本剪贴板桥，不引入 Electron；时间：2026-11-11；作者：lq。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }

# 功能：Windows/Linux 双击文件或拖拽到图标可能启动第二个进程，用单实例插件转发文件参数；时间：2026-10-29；作者：lq。
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
